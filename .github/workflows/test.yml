name: Test

# Tests Pulse, from egoist/pulse, which is private, on macOS, Windows and
# Linux, each of which reads the computer its own way: by hand at a ref,
# and every day at main, since pushes to egoist/pulse do not reach here.
#
#   gh workflow run test.yml --repo egoist/pulse-feedback -f ref=main
#
# Secrets: PULSE_SOURCE_TOKEN, a token that can read egoist/pulse.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The tag, branch or commit of egoist/pulse to test, as main
        required: true
        default: main
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

# A newer run of the same ref makes an older one moot.
concurrency:
  group: test-${{ inputs.ref || 'main' }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-26 }
          - { name: Windows, os: windows-2025 }
          - { name: Linux, os: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v7
        with:
          repository: egoist/pulse
          ref: ${{ inputs.ref || 'main' }}
          token: ${{ secrets.PULSE_SOURCE_TOKEN }}
          # The tests need no git, and the logs here are public.
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
